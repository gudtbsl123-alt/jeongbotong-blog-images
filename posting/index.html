<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>오카와리 게시용 사진</title>
<style>
/* 세트마다 버튼 하나 → 아이폰 공유 창 '이미지 N개 저장' → 사진 앱에 01부터 순서대로. 도시 색 띠는 카드 표지와 같은 색 */
:root{
  --bg:#F4F5F8; --panel:#FFFFFF; --ink:#16181D; --muted:#5F6573; --line:#DCDFE6; --accent:#16181D;
  --tokyo:#2B5BE8; --osaka:#E8392E; --fukuoka:#12A27E; --prep:#AF52DE; --ok:#12A27E;
  --font:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#111317;--panel:#1B1E24;--ink:#EEF0F4;--muted:#A3A9B6;--line:#2E333C;--accent:#EEF0F4;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;font-weight:800;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.how{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.how p{margin:0}
.row{display:flex;flex-direction:column;gap:10px}
.row h2{font-size:15px;font-weight:800;margin:6px 0 0;display:flex;align-items:center;gap:8px}
.row h2 i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.set{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:800;font-size:16px}
.title{color:var(--muted);font-size:13px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok);color:#fff}
.strip{width:100%;border-radius:6px;display:block;background:var(--bg);aspect-ratio:864/150;object-fit:contain}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 12px;font-size:14px;font-weight:600;min-height:42px;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--tokyo);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
button.main{background:var(--accent);color:var(--bg);border-color:var(--accent);width:100%;font-size:17px;min-height:54px}
button.main.saved{background:var(--ok);border-color:var(--ok);color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .wide{grid-column:1 / -1}
.msg{font-size:12px;color:var(--muted);margin:0}
.msg:empty{display:none}
.msg.ok{color:var(--ok)} .msg.err{color:var(--osaka)}
.links{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.links a{color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>게시용 사진</h1>
    <p class="sub" id="updated">불러오는 중…</p>
  </header>
  <div class="how"><p><b>사진 7장 앨범에 저장</b>을 누르고, 뜨는 공유 창에서 <b>이미지 7개 저장</b>을 누르면 사진 앱에 01번부터 순서대로 들어갑니다. 인스타에서 01부터 차례로 고르면 됩니다.</p></div>
  <section id="list" class="row" aria-label="안 올린 세트"></section>
</main>
<script>
const CITY = {"도쿄":"var(--tokyo)","오사카":"var(--osaka)","후쿠오카":"var(--fukuoka)"};
const $ = s => document.querySelector(s);
const canShareFiles = !!(navigator.canShare && navigator.share);
const pad = n => String(n).padStart(2, "0");

function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  kids.flat().forEach(k => k && e.append(k));
  return e;
}

/* 세트마다 카드 파일을 미리 받아 둔다 — 공유 창은 '누른 그 순간'에만 열리므로, 누를 때는 이미 준비돼 있어야 한다 */
const cache = new Map();
function load(s){
  if (!cache.has(s.slug)){
    const p = Promise.all(s.cards.map(async (f, i) => {
      const r = await fetch(`${s.slug}/${f}?v=${s.v}`, {cache:"force-cache"});
      if (!r.ok) throw new Error(f + " " + r.status);
      const b = await r.blob();
      return new File([b], `${s.prefix} ${pad(i + 1)}.jpg`, {type:"image/jpeg"});
    }));
    p.catch(() => cache.delete(s.slug));
    cache.set(s.slug, p);
  }
  return cache.get(s.slug);
}
let queue = Promise.resolve();
function prefetch(s){ queue = queue.then(() => load(s)).catch(() => {}); }

async function copy(text, msg, label){
  try { await navigator.clipboard.writeText(text); msg.className = "msg ok"; msg.textContent = label + " 복사했습니다"; }
  catch (e){ msg.className = "msg err"; msg.textContent = "복사하지 못했습니다"; }
}

function setCard(s){
  const n = s.cards.length;
  const msg = el("p", {class:"msg", "aria-live":"polite"});
  const label = `사진 ${n}장 앨범에 저장`;
  const btn = el("button", {type:"button", class:"main", text:label});
  let ready = null;
  btn.addEventListener("click", async () => {
    if (!canShareFiles){ msg.className = "msg err"; msg.textContent = "이 브라우저는 한 번에 저장을 못 합니다. 아래 01~07을 눌러 받아 주세요."; links.hidden = false; return; }
    if (!ready){
      btn.disabled = true; btn.textContent = "사진 준비 중…";
      try { ready = await load(s); }
      catch (e){ btn.disabled = false; btn.textContent = label; msg.className = "msg err"; msg.textContent = "사진을 받지 못했습니다. 다시 눌러 주세요."; return; }
      btn.disabled = false; btn.textContent = "준비됐습니다 — 눌러서 저장";
      return;   // 준비에 시간이 걸리면 공유 창이 막히므로, 준비가 끝난 뒤 한 번 더 누르게 한다
    }
    try {
      if (!navigator.canShare({files:ready})) throw Object.assign(new Error("files"), {name:"NotSupported"});
      await navigator.share({files:ready});
      btn.classList.add("saved"); btn.textContent = `✓ ${n}장 저장 (다시 누르면 또 저장)`;
      msg.className = "msg ok"; msg.textContent = "공유 창에서 '이미지 " + n + "개 저장'을 고르셨다면 사진 앱에 들어갔습니다.";
    } catch (e){
      if (e && e.name === "AbortError") return;
      msg.className = "msg err"; msg.textContent = "공유 창을 열지 못했습니다(" + (e && e.name || "오류") + "). 다시 눌러 주세요.";
    }
  });
  const links = el("div", {class:"links"}, s.cards.map((f, i) => el("a", {href:`${s.slug}/${f}?v=${s.v}`, download:`${s.prefix} ${pad(i + 1)}.jpg`, text:pad(i + 1)})));
  links.hidden = canShareFiles;

  const t = s.texts || {};
  const btns = el("div", {class:"btns"});
  if (t["caption.txt"]) btns.append(el("button", {type:"button", text:"캡션 복사", onclick:() => copy(t["caption.txt"], msg, "캡션")}));
  if (t["first_comment.txt"]) btns.append(el("button", {type:"button", text:"첫 댓글 복사", onclick:() => copy(t["first_comment.txt"], msg, "첫 댓글")}));
  if (t["pinned_comment.txt"]) btns.append(el("button", {type:"button", text:"고정 댓글 복사", onclick:() => copy(t["pinned_comment.txt"], msg, "고정 댓글")}));
  const rc = t["reel_caption_clip.txt"] || t["reel_caption_card.txt"];
  if (rc) btns.append(el("button", {type:"button", text:"릴스 캡션 복사", onclick:() => copy(rc, msg, "릴스 캡션")}));
  if (t["threads.txt"]) btns.append(el("button", {type:"button", text:"Threads 글 복사", onclick:() => copy(t["threads.txt"], msg, "Threads 글")}));
  if (btns.children.length % 2) btns.lastElementChild.classList.add("wide");

  const card = el("article", {class:"set", style:`--c:${CITY[s.city] || "var(--prep)"}`},
    el("div", {class:"head"},
      el("div", {}, el("div", {class:"name", text:s.prefix}), s.title ? el("div", {class:"title", text:s.title.replace(" / ", " ")}) : null),
      el("span", {class:"chip", text:`${n}장`})),
    s.thumb ? el("img", {class:"strip", src:s.thumb, alt:`${s.prefix} 카드 ${n}장 미리보기`}) : null,
    btn, links, btns.children.length ? btns : null, msg);

  /* 화면 가까이 오면 미리 받아 두고, 다 받았으면 버튼 한 번에 공유 창이 열린다 */
  const io = new IntersectionObserver(es => {
    if (es.some(e => e.isIntersecting)){
      io.disconnect();
      if (canShareFiles) queue = queue.then(() => load(s).then(f => { if (!ready){ ready = f; } })).catch(() => {});
    }
  }, {rootMargin:"300px"});
  io.observe(card);
  return card;
}

function rowKey(s){ const k = s.prefix.replace(/^\d{4}\s+/, "").replace(/\d+$/, ""); return s.city && k.startsWith(s.city) ? s.city + " " + k.slice(s.city.length) : k; }

(async () => {
  try {
    const r = await fetch("index.json?t=" + Date.now(), {cache:"no-store"});
    const idx = await r.json();
    $("#updated").textContent = `안 올린 세트 ${idx.sets.length}개 · ${idx.updated}`;
    const box = $("#list"); let cur = null, sec = null;
    for (const s of idx.sets){
      const k = rowKey(s);
      if (k !== cur){ cur = k; sec = el("div", {class:"row", style:`--c:${CITY[s.city] || "var(--prep)"}`}, el("h2", {}, el("i"), k)); box.append(sec); }
      sec.append(setCard(s));
    }
    if (!idx.sets.length) box.append(el("p", {class:"sub", text:"안 올린 세트가 없습니다."}));
  } catch (e){
    $("#updated").textContent = "목록을 불러오지 못했습니다. 새로 고침해 주세요.";
  }
})();
</script>
</body>
</html>
